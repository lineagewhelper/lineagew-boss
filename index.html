<title>天堂W｜首領重生時刻表（台灣時間）</title>
<style>
:root{
  --bg:#080705; --panel:#11100d; --panel2:#18150f; --gold:#d8b45a; --gold2:#f1d58a;
  --muted:#9e947e; --line:#3b3020; --text:#f4efe3; --danger:#e36b5d; --ok:#87c38f;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:
radial-gradient(circle at 50% -10%,#2b2110 0,transparent 32rem),
linear-gradient(180deg,#090806,#050504 65%);color:var(--text);
font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1480px;margin:auto;padding:calc(28px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(22px + env(safe-area-inset-left))}
header{border:1px solid var(--line);background:linear-gradient(135deg,rgba(216,180,90,.12),rgba(0,0,0,.2));
padding:26px 28px;position:relative;overflow:hidden}
header:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(241,213,138,.05),transparent);pointer-events:none}
.eyebrow{color:var(--gold);letter-spacing:.22em;font-size:12px;font-weight:800}
h1{margin:8px 0 7px;font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(30px,5vw,52px);letter-spacing:.04em}
h1 span{color:var(--gold2)}
.sub{color:#bcb29e;font-size:14px}
.topgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}
.card{background:linear-gradient(180deg,#15130f,#0e0d0a);border:1px solid var(--line);padding:18px}
.card h2{font-size:12px;letter-spacing:.18em;color:var(--gold);margin:0 0 10px;text-transform:uppercase}
.nextname{font-size:25px;font-weight:900}.nexttime{color:var(--gold2);font-size:15px;margin-top:7px}
.countdown{font:700 28px/1.1 ui-monospace,SFMono-Regular,Consolas,monospace;margin-top:13px}
.clock{font:700 26px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--gold2)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 12px}
button,input{background:#0d0c09;color:var(--text);border:1px solid var(--line);padding:10px 13px;font:inherit}
button{cursor:pointer} button:hover,button.active{border-color:var(--gold);color:var(--gold2);background:#19150d}
input{min-width:230px;flex:1;outline:none}input:focus{border-color:var(--gold)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:10px 0 18px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:6px}
.tablebox{overflow:auto;border:1px solid var(--line);background:#0b0a08}
table{border-collapse:collapse;width:100%;min-width:1080px}
th,td{border-right:1px solid #282218;border-bottom:1px solid #282218;vertical-align:top}
th{position:sticky;top:0;z-index:2;background:#17130d;color:var(--gold2);padding:13px 9px;font-size:13px}
th:first-child{left:0;z-index:3}
td.time{position:sticky;left:0;z-index:1;background:#100e0a;color:var(--gold2);font:800 15px ui-monospace,monospace;padding:14px 12px;white-space:nowrap}
td.slot{padding:8px;min-width:145px}
.boss{border-left:2px solid #80652c;background:#15120c;padding:7px 8px;margin:4px 0;font-size:12px;line-height:1.35;transition:.15s}
.boss:hover{background:#211b0e;border-left-color:var(--gold2);transform:translateX(2px)}
.boss.soon{
  color:#fff3c4;
  background:linear-gradient(90deg,#3a2c0d,#211806);
  border-left-color:#f1d58a;
  box-shadow:0 0 16px rgba(216,180,90,.30),inset 0 0 0 1px rgba(241,213,138,.75);
  font-weight:900;
}
.event.soon{
  background:linear-gradient(90deg,rgba(216,180,90,.18),rgba(216,180,90,.03));
  box-shadow:inset 3px 0 #f1d58a,0 0 16px rgba(216,180,90,.12);
  border:1px solid rgba(241,213,138,.78);
  border-radius:8px;
  margin:7px 0;
  padding-left:10px;
}
.event.soon .event-time{color:#fff0ad;font-weight:900}
.event.soon .tag{border-color:#a88437;color:#fff3c4;background:#211806;font-weight:800}
.boss.past{color:#666158;background:#0b0a08;border-left-color:#2b2924;opacity:.52}
.event.past{opacity:.46}
.event.past .event-time,.event.past .tag{color:#666158}
.event.past .tag{background:#0b0a08;border-color:#29261f}
.empty{color:#514b3e;text-align:center;padding:12px}
.today{background:linear-gradient(180deg,rgba(216,180,90,.07),transparent)}
.dayhead.today{box-shadow:inset 0 -2px var(--gold)}
.mobile{display:block}
.day-section{margin-top:12px}.day-title{color:var(--gold2);font-size:18px;border-bottom:1px solid var(--line);padding:10px 2px}
.event{display:grid;grid-template-columns:72px 1fr;gap:12px;border-bottom:1px solid #282218;padding:12px 4px}
.event-time{color:var(--gold2);font:800 15px ui-monospace,monospace}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{background:#17130d;border:1px solid #3b3020;padding:6px 8px;font-size:12px}
.note{margin-top:18px;color:#827967;font-size:12px;line-height:1.7}
.note a{color:var(--gold);text-decoration:none}.note a:hover{text-decoration:underline}
.badge{display:inline-block;border:1px solid #6b5628;color:var(--gold2);padding:3px 7px;font-size:11px;margin-left:6px}
@media(max-width:800px){body{overscroll-behavior-y:none}.topgrid{grid-template-columns:1fr}.desktop{display:none}.mobile{display:block}.wrap{padding:14px 12px 40px}header{padding:20px 18px}.controls{position:sticky;top:0;background:#080705;padding:8px 0;z-index:5}}

@media(max-width:800px){
  .event.soon{
    background:#2b210b !important;
    border:2px solid #d8b45a !important;
    box-shadow:0 0 12px rgba(216,180,90,.45), inset 0 0 18px rgba(216,180,90,.10) !important;
    opacity:1 !important;
  }
  .event.soon .event-time{color:#ffe7a0 !important}
  .event.soon .tag{
    color:#fff5d6 !important;
    background:#1d1608 !important;
    border-color:#d8b45a !important;
  }
  .event.soon .badge{
    background:#d8b45a;
    color:#080705;
    border-color:#f1d58a;
    font-weight:900;
  }
}


/* v5 readability upgrades */
.viewtabs{display:flex;gap:8px;margin:14px 0 8px}
.viewtabs button{flex:1;font-weight:800}
.mobile-summary{display:block}
.nowline{display:flex;align-items:center;gap:9px;color:var(--gold2);font-size:11px;font-weight:900;letter-spacing:.08em;margin:12px 0}
.nowline:before,.nowline:after{content:"";height:1px;background:var(--gold);flex:1;opacity:.65}
.past-toggle{width:100%;margin:8px 0 4px;color:#8f8777}
.relative{font-size:11px;color:#b8a66f;margin-top:3px}
.event.soon .relative{color:#ffe7a0}
.event.compact{display:none}
@media(max-width:800px){
  .mobile-summary{display:block}
  #controls [data-day]{display:none}
  #controls.show-weekdays [data-day]{display:inline-block}
  #controls{margin-top:8px}
  .event{grid-template-columns:82px 1fr}
  .event.past{display:none}
  .event.past.show{display:grid}
  .day-section{margin-top:4px}
  .day-title{display:none}
}

/* v6 unified desktop + mobile experience */
#controls [data-day]{display:none}
#controls.show-weekdays [data-day]{display:inline-block}
#mobileList{max-width:1050px;margin:0 auto}
.viewtabs{max-width:1050px;margin:18px auto 8px}
#controls{max-width:1050px;margin-left:auto;margin-right:auto}
.event{
  grid-template-columns:150px 1fr;
  align-items:center;
  padding:16px 14px;
  border:1px solid #282218;
  border-radius:8px;
  margin:8px 0;
  background:#0e0c09;
}
.event-time{font-size:18px}
.relative{font-size:12px}
.tags{gap:8px}
.tag{font-size:13px;padding:7px 10px}
.nowline{margin:18px 0;font-size:12px}
.past-toggle{max-width:1050px}
@media(max-width:800px){
  .event{grid-template-columns:88px 1fr;padding:12px 8px;border-left:0;border-right:0;border-radius:0;margin:0}
  .event-time{font-size:15px}
  .tag{font-size:12px;padding:6px 8px}
}

/* FIX: 已結束時段的展開/收起，電腦與手機都生效 */
#mobileList .event.past{display:none}
#mobileList .event.past.show{display:grid}

</style>

<body>
<div class="wrap">
<header>
  <div class="eyebrow">LINEAGE W · BOSS SCHEDULE</div>
  <h1>天堂W <span>首領重生時刻表</span></h1>
  <div class="sub">所有時刻已由韓國時間 KST（UTC+9）換算為台灣時間 UTC+8｜2026/10/14 起適用</div>
</header>

<section class="topgrid">
  <div class="card">
    <h2>Next Boss · 下一場</h2>
    <div class="nextname" id="nextName">計算中…</div>
    <div class="nexttime" id="nextTime">—</div>
    <div class="countdown" id="countdown">--:--:--</div>
  </div>
  <div class="card">
    <h2>Taiwan Time · 台灣時間</h2>
    <div class="clock" id="clock">--:--:--</div>
    <div class="sub" id="dateText" style="margin-top:8px">—</div>
  </div>
</section>

<div class="viewtabs mobile-summary">
  <button id="todayView" class="active">今天</button>
  <button id="weekView">全週</button>
</div>
<div class="controls" id="controls">
  <button data-day="-1">全週</button>
  <button data-day="1">一</button><button data-day="2">二</button><button data-day="3">三</button>
  <button data-day="4">四</button><button data-day="5">五</button><button data-day="6">六</button><button data-day="0">日</button>
  <button id="todayBtn" class="active">只顯示今天</button>
  <input id="search" placeholder="搜尋首領，例如：不死鳥、安塔瑞斯">
</div>

<div class="legend"><span><i class="dot"></i>時間皆為台灣時間</span><span>同一格代表同時出現</span><span id="updated">資料基準：官方 Guidebook 2026-10-12 更新版</span></div>

<div class="desktop tablebox" id="desktopWeek" style="display:none"><table id="scheduleTable"></table></div>
<div class="mobile" id="mobileList"></div>

<div class="note">
  資料依據：<a href="https://lineagew.plaync.com/tw/guidebook/view?title=%E6%AF%8F%E9%80%B1%E9%A6%96%E9%A0%98%E6%97%A5%E7%A8%8B%E8%AA%AA%E6%98%8E" target="_blank" rel="noopener">天堂W 官方每週首領日程說明</a>。
  原始日程為 KST（UTC+9），本頁統一減 1 小時顯示為台灣時間（UTC+8）。遊戲更新可能調整首領時間，實際仍以官方最新公告為準。
</div>
</div>

<script>
const DAYS=['日','一','二','三','四','五','六'];
// 原資料為 KST；此處已全部轉成台灣 UTC+8。
const S = {
  "15:00":{
    1:["水／火／地／風之大精靈","死亡","巨蟻女皇"],
    2:["水／火／地／風之大精靈","古拉","巨蟻女皇","冰之女王"],
    3:["水／火／地／風之大精靈","死亡","巨蟻女皇"],
    4:["水／火／地／風之大精靈","古拉","巨蟻女皇"],
    5:["水／火／地／風之大精靈","墮落","巨蟻女皇"],
    6:["水／火／地／風之大精靈","惡魔"],
    0:["水／火／地／風之大精靈"]
  },
  "18:00":{5:["古代巨人"],6:["古代巨人"]},
  "19:00":{
    1:["克特","阿勒尼亞","巫師","被遺忘者阿爾斯卡利亞"],
    2:["克特","阿勒尼亞","巫師","被遺忘者阿爾斯卡利亞"],
    3:["克特","阿勒尼亞","巫師","被遺忘者阿爾斯卡利亞"],
    4:["克特","阿勒尼亞","巫師","被遺忘者阿爾斯卡利亞"],
    5:["克特","阿勒尼亞","巫師","被遺忘者阿爾斯卡利亞"],
    6:["不幸的幻象眼魔","死亡的殭屍王","不死的木乃伊王","黑暗的騎士範德","傲慢的烏格奴斯"],
    0:["不幸的幻象眼魔","死亡的殭屍王","不死的木乃伊王","黑暗的騎士範德","傲慢的烏格奴斯"]
  },
  "19:05":{
    1:["扭曲的傑尼斯女王","恐怖的吸血鬼","地獄的黑豹","殘酷的艾莉絲","不滅的巫妖"],
    2:["扭曲的傑尼斯女王","恐怖的吸血鬼","地獄的黑豹","殘酷的艾莉絲","不滅的巫妖"],
    3:["扭曲的傑尼斯女王","恐怖的吸血鬼","地獄的黑豹","殘酷的艾莉絲","不滅的巫妖"],
    4:["扭曲的傑尼斯女王","恐怖的吸血鬼","地獄的黑豹","殘酷的艾莉絲","不滅的巫妖"],
    5:["扭曲的傑尼斯女王","恐怖的吸血鬼","地獄的黑豹","殘酷的艾莉絲","不滅的巫妖"]
  },
  "19:15":{
    1:["黑色亡靈萊奧斯","死亡騎士","鑽石高崙"],
    2:["黑色亡靈萊奧斯","死亡騎士","船長卡利索"],
    3:["黑色亡靈萊奧斯","死亡騎士","疾風的巨大飛龍"],
    4:["黑色亡靈萊奧斯","死亡騎士","巨大蠕蟲"],
    5:["黑色亡靈萊奧斯","死亡騎士","大黑長者"],
    6:["黑色亡靈萊奧斯","死亡騎士","狂風的夏斯奇"],
    0:["黑色亡靈萊奧斯","漆黑的死亡騎士"]
  },
  "20:00":{
    3:["狂信亞","無花"],
    4:["地龍安塔瑞斯","哈汀"],
    5:["法利昂"],
    6:["艾奇德娜","監視者死神","支配的寡婦王"],
    0:["[傳承] 克特","[傳承] 巴風特"]
  },
  "21:00":{
    1:["不死鳥","自警團長馬托爾","暗殺軍王史雷佛","冥法軍王海露拜","魔獸軍王巴蘭卡","魔靈軍王蕾雅","亡靈克里波斯"],
    2:["塔坤","自警團長馬托爾","暗殺軍王史雷佛","冥法軍王海露拜","魔獸軍王巴蘭卡","魔靈軍王蕾雅","亡靈克里波斯"],
    3:["不死鳥","自警團長馬托爾","憤怒／兇惡的飛龍王","守門人拉克夏爾","歐西里斯"],
    4:["塔坤","自警團長馬托爾","杰弗雷庫","古代守護者","拉特摩爾"],
    5:["不死鳥","自警團長馬托爾","憤怒／兇惡的飛龍王"],
    6:["塔坤","自警團長馬托爾","亞力安王","梅塔特隆"],
    0:["不死鳥","自警團長馬托爾","巨大米諾陶洛斯","墮落者迪亞勒","扭曲的席琳"]
  },
  "22:00":{
    1:["水／火／地／風之大精靈"],2:["水／火／地／風之大精靈"],3:["水／火／地／風之大精靈"],
    4:["水／火／地／風之大精靈"],5:["水／火／地／風之大精靈"],6:["水／火／地／風之大精靈"],0:["水／火／地／風之大精靈"]
  }
};

let selected=twDate().getDay(), query="";
const pad=n=>String(n).padStart(2,'0');
function twParts(d=new Date()){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(d);
  return Object.fromEntries(p.map(x=>[x.type,x.value]));
}
function twDate(d=new Date()){
  return new Date(d.toLocaleString('en-US',{timeZone:'Asia/Taipei'}));
}
function matches(arr){return !query || arr.some(x=>x.toLowerCase().includes(query.toLowerCase()))}
function relativeText(target,now){
  let m=Math.max(0,Math.ceil((target-now)/60000));
  if(m<60)return `${m} 分鐘後`;
  const h=Math.floor(m/60), r=m%60;
  return r?`${h} 小時 ${r} 分後`:`${h} 小時後`;
}
let pastOpen=false;
function render(){
  const now=twDate(), today=now.getDay();
  const upcoming=nextEvent();
  const order=[1,2,3,4,5,6,0], times=Object.keys(S);
  let h='<thead><tr><th>台灣時間</th>'+order.map(d=>`<th class="dayhead ${d===today?'today':''}" style="${selected!==-1&&d!==selected?'display:none':''}">週${DAYS[d]}</th>`).join('')+'</tr></thead><tbody>';
  for(const t of times){
    h+=`<tr><td class="time">${t}</td>`;
    for(const d of order){
      let a=(S[t][d]||[]).filter(x=>!query||x.toLowerCase().includes(query.toLowerCase()));
      const hide=selected!==-1 && d!==selected;
      const [th,tm]=t.split(':').map(Number);
      const isPast=d===today&&(now.getHours()>th||(now.getHours()===th&&now.getMinutes()>=tm));
      const isSoon=upcoming&&d===upcoming.d&&t===upcoming.time;
      h+=`<td class="slot ${d===today?'today':''}" style="${hide?'display:none':''}">`+
        (a.length?a.map(x=>`<div class="boss ${isPast?'past':''} ${isSoon?'soon':''}">${x}${isSoon?' <span class="badge">NEXT</span>':''}</div>`).join(''):`<div class="empty">—</div>`)+`</td>`;
    }
    h+='</tr>';
  }
  h+='</tbody>'; document.getElementById('scheduleTable').innerHTML=h;

  let mh='', pastCount=0, nowInserted=false;
  const showDays=selected===-1?order:[selected];
  for(const d of showDays){
    mh+=`<section class="day-section"><div class="day-title">週${DAYS[d]} ${d===today?'<span class="badge">今天</span>':''}</div>`;
    for(const t of times){
      let a=(S[t][d]||[]).filter(x=>!query||x.toLowerCase().includes(query.toLowerCase()));
      if(!a.length) continue;
      const [th,tm]=t.split(':').map(Number);
      const isPast=d===today&&(now.getHours()>th||(now.getHours()===th&&now.getMinutes()>=tm));
      const isSoon=upcoming&&d===upcoming.d&&t===upcoming.time;
      if(isPast) pastCount++;
      if(d===today && !isPast && !nowInserted){
        mh+=`<div class="nowline">現在 ${pad(now.getHours())}:${pad(now.getMinutes())}</div>`;
        nowInserted=true;
      }
      const target=new Date(now); target.setHours(th,tm,0,0);
      const rel=d===today&&!isPast?`<div class="relative">${relativeText(target,now)}</div>`:'';
      mh+=`<div class="event ${isPast?'past':''} ${pastOpen&&isPast?'show':''} ${isSoon?'soon':''}">
        <div class="event-time">${t}${isSoon?' <span class="badge">NEXT</span>':''}${rel}</div>
        <div class="tags">${a.map(x=>`<span class="tag">${x}</span>`).join('')}</div>
      </div>`;
    }
    mh+='</section>';
  }
  if(selected===today && pastCount){
    mh=`<button class="past-toggle" id="pastToggle">${pastOpen?'收起已結束':'已結束 '+pastCount+' 個時段　展開'}</button>`+mh;
  }
  document.getElementById('mobileList').innerHTML=mh;
  const pt=document.getElementById('pastToggle');
  if(pt)pt.onclick=()=>{pastOpen=!pastOpen;render()};
}
function nextEvent(){
  const now=twDate(), day=now.getDay();
  let candidates=[];
  for(let add=0;add<8;add++){
    const d=(day+add)%7;
    for(const [time,map] of Object.entries(S)){
      if(!map[d]) continue;
      const [hh,mm]=time.split(':').map(Number);
      const x=new Date(now); x.setDate(now.getDate()+add); x.setHours(hh,mm,0,0);
      if(x>now) candidates.push({x,names:map[d],time,d});
    }
  }
  candidates.sort((a,b)=>a.x-b.x);
  return candidates[0];
}
function tick(){
  const p=twParts(), now=twDate();
  document.getElementById('clock').textContent=`${p.hour}:${p.minute}:${p.second}`;
  document.getElementById('dateText').textContent=`${p.year}/${p.month}/${p.day}　週${DAYS[now.getDay()]}　UTC+8`;
  const n=nextEvent(); if(!n)return;
  const diff=n.x-now, sec=Math.max(0,Math.floor(diff/1000));
  const hh=Math.floor(sec/3600), mm=Math.floor(sec%3600/60), ss=sec%60;
  document.getElementById('nextName').textContent=n.names.join(' · ');
  document.getElementById('nextTime').textContent=`週${DAYS[n.d]} ${n.time}（台灣時間）`;
  document.getElementById('countdown').textContent=`${pad(hh)}:${pad(mm)}:${pad(ss)}`;
}
document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
  selected=+b.dataset.day;
  document.querySelectorAll('[data-day]').forEach(x=>x.classList.toggle('active',x===b));
  document.getElementById('todayBtn').classList.remove('active');
  document.getElementById('desktopWeek').style.display='none';
  document.getElementById('mobileList').style.display='block';
  render();
});
document.getElementById('todayBtn').onclick=()=>{
  selected=twDate().getDay();
  document.querySelectorAll('[data-day]').forEach(x=>x.classList.remove('active'));
  document.getElementById('todayBtn').classList.add('active');
  document.getElementById('desktopWeek').style.display='none';
  document.getElementById('mobileList').style.display='block';
  document.getElementById('todayView').classList.add('active');
  document.getElementById('weekView').classList.remove('active');
  render();
};
document.getElementById('search').oninput=e=>{query=e.target.value.trim();render()};

document.getElementById('todayView').onclick=()=>{
  selected=twDate().getDay();
  document.getElementById('todayView').classList.add('active');
  document.getElementById('weekView').classList.remove('active');
  document.getElementById('controls').classList.remove('show-weekdays');
  document.getElementById('desktopWeek').style.display='none';
  document.getElementById('mobileList').style.display='block';
  render();
};
document.getElementById('weekView').onclick=()=>{
  selected=-1;
  document.getElementById('weekView').classList.add('active');
  document.getElementById('todayView').classList.remove('active');
  document.getElementById('controls').classList.add('show-weekdays');
  if(window.innerWidth>800){
    document.getElementById('desktopWeek').style.display='block';
    document.getElementById('mobileList').style.display='none';
  }else{
    document.getElementById('desktopWeek').style.display='none';
    document.getElementById('mobileList').style.display='block';
  }
  render();
};

render(); tick(); setInterval(tick,1000); setInterval(render,60000);
</script>
